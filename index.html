<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOW New Comer & Member's Database</title>
<style>
  :root{
    --bg:#F7F4EE; --panel:#FFFFFF; --ink:#2A2C27; --muted:#7A7A6F;
    --olive:#8C8014; --olive-dark:#5E570D; --gold:#C6963C; --clay:#B25B4A; --line:#E4DFD2; --radius:10px;
    font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  h1,h2,h3{ font-family: Georgia,"Iowan Old Style","Songti SC",serif; letter-spacing:.2px; }
  .app{max-width:1180px;margin:0 auto;padding:22px 20px 60px;}
  header.top{ display:flex;justify-content:space-between;align-items:center;gap:16px; padding-bottom:16px;border-bottom:2px solid var(--olive);margin-bottom:18px;flex-wrap:wrap; }
  .brand{display:flex;align-items:center;gap:16px;}
  .brand img{height:72px;width:auto;display:block;}
  .titleblock h1{font-size:18px;margin:0;color:var(--olive-dark);line-height:1.3;font-weight:700;}
  .titleblock .cn-line{font-size:18px;margin:0;color:var(--olive-dark);line-height:1.3;font-weight:700;font-family:Georgia,"Songti SC","Noto Serif SC",serif;}
  .sheetlink{ display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--olive-dark); text-decoration:none;border:1px solid var(--olive); border-radius:999px;padding:7px 14px; }
  .sheetlink:hover{background:#F1EFD9;}
  nav.tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
  nav.tabs button{ border:1px solid var(--line);background:var(--panel);color:var(--ink); padding:9px 15px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600; display:flex;align-items:center;gap:6px; }
  nav.tabs button.active{background:var(--olive-dark);border-color:var(--olive-dark);color:#fff;}
  nav.tabs button .lock{font-size:11px;opacity:.7;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:18px;}
  .card h2{margin-top:0;font-size:18px;color:var(--olive-dark);padding-bottom:10px;border-bottom:2px solid #EFE9D8;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600;min-height:2.5em;line-height:1.25;}
  input[type=text],input[type=number],input[type=date],input[type=email],input[type=month],select,textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-size:14px;background:#FCFBF8;color:var(--ink);
  }
  input::placeholder,textarea::placeholder{font-size:12px;color:#B0AC9C;}
  textarea{min-height:56px;font-family:inherit;resize:vertical;}
  .field{margin-bottom:2px;}
  fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px 16px;margin:0 0 18px;background:#FDFCF9;}
  legend{ padding:5px 14px;font-weight:700;color:#fff;font-size:12.5px;letter-spacing:.4px;text-transform:uppercase; background:var(--olive);border-radius:999px; }
  .radio-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px;}
  .radio-row label{display:flex;align-items:center;gap:6px;font-weight:500;color:var(--ink);font-size:13.5px;min-height:auto;}
  .btn{ border:none;padding:10px 20px;border-radius:7px;font-weight:700;cursor:pointer;font-size:14px; background:var(--olive); color:#fff; }
  .btn.secondary{background:#fff;color:var(--olive-dark);border:1px solid var(--olive);}
  .btn.gold{background:var(--gold);} .btn.clay{background:var(--clay);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.3px;}
  .tag.EN{background:#E3EEEA;color:#1E4038;} .tag.CH{background:#F5E9D4;color:#8A5E1A;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{padding:8px 9px;text-align:left;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;}
  tr.clickable{cursor:pointer;} tr.clickable:hover{background:#FBF7EF;}
  td.clickable{cursor:pointer;color:var(--olive-dark);font-weight:600;} td.clickable:hover{text-decoration:underline;}
  .badge-danger{color:var(--clay);font-weight:700;}
  .empty{color:var(--muted);font-style:italic;padding:14px 0;}
  .lockscreen{max-width:380px;margin:60px auto;text-align:center;}
  .lockscreen input{margin-bottom:12px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:center;}
  .stat.clickable{cursor:pointer;transition:box-shadow .15s,border-color .15s;}
  .stat.clickable:hover{box-shadow:0 2px 10px rgba(0,0,0,.08);border-color:var(--olive);}
  .stat .num{font-family:Georgia,serif;font-size:28px;color:var(--olive-dark);}
  .stat .lbl{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px;}
  .mini-card-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:18px;}
  .mini-card{padding:16px;margin-bottom:0;font-size:12.5px;}
  .mini-card .section-head{padding:9px 14px;margin:-16px -16px 12px;}
  .mini-card .section-head h2{font-size:14px;}
  .mini-card .hint{font-size:11px;padding:7px 10px;margin:6px 0 10px;}
  .mini-card input,.mini-card select{font-size:12px;padding:7px 8px;}
  .mini-card .btn,.mini-card .btn.secondary{font-size:12px;padding:7px 12px;}
  .profile-card{border:2px solid var(--olive);border-radius:var(--radius);padding:0;overflow:hidden;max-width:480px;}
  .profile-card .ph{background:var(--olive-dark);color:#fff;padding:16px 20px;}
  .profile-card .ph h3{margin:0;font-size:19px;}
  .profile-card .sec{padding:14px 20px;border-top:1px solid var(--line);}
  .profile-card .sec h4{margin:0 0 8px;font-size:12px;letter-spacing:.5px;color:var(--gold);text-transform:uppercase;}
  .profile-card .kv{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;border-bottom:1px dashed #EFE9DC;gap:14px;}
  .profile-card .kv span:first-child{color:var(--muted);flex:0 0 auto;} .profile-card .kv span:last-child{text-align:right;}
  .sop-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:760px){.sop-cols{grid-template-columns:1fr;} .brand img{height:44px;}}
  .sop-step{display:flex;gap:12px;}
  .sop-step .n{ flex:0 0 30px;height:30px;border-radius:50%;background:var(--olive);color:#fff;font-weight:700; display:flex;align-items:center;justify-content:center;font-size:13px; }
  .sop-step .body{flex:1;padding-bottom:18px;border-left:2px solid var(--line);margin-left:15px;padding-left:20px;margin-top:-2px;}
  .sop-step:last-child .body{border-left:2px solid transparent;}
  .sop-step .body h5{margin:0 0 4px;font-size:14.5px;color:var(--olive-dark);}
  .sop-step .body p{margin:0;font-size:13px;color:#565650;line-height:1.5;}
  .sop-title{font-family:Georgia,serif;color:var(--olive-dark);font-size:16px;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--gold);}
  .hint{font-size:12px;color:#6B6A5C;margin:10px 0 14px;background:#FBF7EC;border-left:3px solid var(--gold);padding:9px 12px;border-radius:0 6px 6px 0;line-height:1.55;}
  .entered-by-bar{ display:flex;align-items:center;gap:12px;background:#F1EFD9;border:1px solid #E0D8B0;border-radius:8px; padding:12px 16px;margin-bottom:16px;flex-wrap:wrap; }
  .entered-by-bar label{margin:0;font-weight:700;font-size:13px;color:var(--olive-dark);white-space:nowrap;min-height:auto;}
  .entered-by-bar input{flex:1;min-width:180px;margin:0;background:#fff;}
  .toolbar-group{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;}
  .toolbar-group:first-of-type{border-top:none;margin-top:14px;padding-top:0;}
  .toolbar-group .tg-label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;}
  .toolbar-group.danger .tg-label{color:var(--clay);}
  .filterbar{ display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;background:#FBF9F3;border:1px solid var(--line);border-radius:8px;padding:12px; }
  .filterbar select,.filterbar input{ font-size:12.5px;padding:7px 8px;margin:0; }
  .filterbar .flabel{ font-size:10px;color:var(--muted);font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px; }
  .section-head{ background:var(--olive-dark);color:#fff;padding:12px 18px;border-radius:8px 8px 0 0;margin:-22px -22px 16px; }
  .section-head h2{ color:#fff;margin:0;border:none;padding:0; }
  .section-head p{ color:#E7E4D4;margin:4px 0 0;font-size:12.5px; }
  .section-head.clickable-section{ cursor:pointer; } .section-head.clickable-section:hover{ background:#26430D; }
  .toggle-arrow{ float:right;font-size:13px;opacity:.85; }
  .modal-overlay{ position:fixed;inset:0;background:rgba(42,44,39,0.55);display:flex;align-items:center;justify-content:center;z-index:1200;padding:20px; }
  .modal-box{ background:#fff;border-radius:var(--radius);padding:22px;max-width:380px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25); }
  .modal-msg{ font-size:14px;line-height:1.6;margin:0 0 16px;white-space:pre-line; }
  #toast{ position:fixed;bottom:24px;left:50%;transform:translateX(-50%); background:var(--olive-dark);color:#fff;padding:10px 22px;border-radius:14px;font-size:13.5px; opacity:0;pointer-events:none;transition:opacity .25s; z-index:999; text-align:center; line-height:1.5; max-width:90vw; }
  #toast.show{opacity:1;}
  input[type=file]{font-size:12.5px;}
  .print-header{display:none;}
  @media print{
    @page{ size: A4; margin: 14mm; }
    /* Only the dynamically-created print report should render on the printed
       page — hiding the rest via display:none (not visibility:hidden) removes
       it from layout entirely, so it can't leave trailing blank pages behind. */
    #app, #toast{ display:none !important; }
    .print-target{ display:flex !important; position:static !important; left:auto !important; top:auto !important; flex-direction:column; align-items:center; width:100%; }
    .print-header{ display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:18px; padding-bottom:12px;border-bottom:2px solid var(--olive);width:100%;max-width:480px; }
    .print-header img{height:46px;width:auto;}
    .print-header .pt{font-family:Georgia,serif;font-weight:700;color:var(--olive-dark);font-size:15px;line-height:1.35;}
    .profile-card{max-width:480px;width:100%;}
  }
/* ---- additions for v2 ---- */
.muted{color:var(--muted);font-size:12.5px;}
.err{color:var(--clay);font-size:13px;margin:10px 0 0;}
.btn.sm{padding:6px 12px;font-size:12.5px;}
.userbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#FBF9F3;border:1px solid var(--line);border-radius:8px;padding:8px 14px;margin-bottom:14px;font-size:12.5px;color:var(--muted);}
.userbar b{color:var(--ink);}
.rolechip{display:inline-block;background:#F1EFD9;color:var(--olive-dark);border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;margin-left:6px;}
.login-card{max-width:400px;margin:30px auto;}
.login-card label{min-height:auto;}
.banner-warn{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#FFF4DC;border:1px solid #E8C877;border-left:4px solid var(--gold);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;line-height:1.5;}
.fu-box{background:#FBF9F3;border:1px solid var(--line);border-radius:8px;padding:12px 14px;}
.fu-list{list-style:none;margin:0;padding:0;}
.fu-list li{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px dashed #E6E0D0;font-size:13px;}
.fu-list li:last-child{border-bottom:none;}
.fu-list.ro li{padding:3px 0;font-size:12.5px;text-align:left;}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--muted);}
.table-scroll{overflow-x:auto;}
.history-box{margin-top:16px;border-top:1px solid var(--line);padding-top:10px;}
.history-box summary{cursor:pointer;font-weight:700;color:var(--olive-dark);font-size:13.5px;margin-bottom:8px;}
table.hist td,table.hist th{font-size:12px;vertical-align:top;}
.spinner{width:34px;height:34px;border:3px solid #E4DFD2;border-top-color:var(--olive);border-radius:50%;margin:0 auto 16px;animation:spin .9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.checks{display:flex;flex-wrap:wrap;gap:6px 18px;}
label.chk{display:flex;align-items:center;gap:6px;min-height:auto;font-weight:500;color:var(--ink);font-size:13px;margin:0;}
label.chk input{width:auto;}
td.grp{background:#F1EFD9;color:var(--olive-dark);font-weight:700;font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;}
table.sgedit input[type=text],table.sgedit select{padding:6px 8px;font-size:12.5px;min-width:130px;}
.profile-card .kv ul{margin:0;}
</style>
</head>

/* ---------------- small helpers ---------------- */
function uid(){ return 'r' + Array.from(crypto.getRandomValues(new Uint8Array(6))).map(b=>b.toString(16).padStart(2,'0')).join(''); }
function esc(v){ return v===undefined||v===null ? '' : String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function digitsOnly(s){ return (s||'').toString().replace(/[^0-9]/g,''); }
function normalizeKey(v){ return (v||'').toString().trim().toLowerCase().replace(/[\s\-]/g,''); }
function hasVal(v){ return v!==undefined && v!==null && String(v).trim()!=='' && String(v).trim().toUpperCase()!=='N/A'; }
const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* Entries typed in capitals (legacy data) are shown/edited in normal case. */
function isAllCaps(s){ return /[A-Z]/.test(s) && !/[a-z]/.test(s); }
function titleCase(s){ return s.toLowerCase().replace(/(^|[\s\-\/'".,()])([a-z\u00C0-\u024F])/g,(m,a,b)=>a+b.toUpperCase()); }
function sentenceCase(s){ return s.toLowerCase().replace(/(^\s*|[.!?]\s+)([a-z])/g,(m,a,b)=>a+b.toUpperCase()); }
const NAME_KEYS = ['name','guestOf','counselorName','followedUpBy','lastUpdatedBy','specialEventName','address'];
const TEXT_KEYS = ['remarksWelcome','remarksDecision'];
function normalizeRecord(r){
  NAME_KEYS.forEach(k=>{ if(typeof r[k]==='string' && isAllCaps(r[k])) r[k]=titleCase(r[k]); });
  TEXT_KEYS.forEach(k=>{ if(typeof r[k]==='string' && isAllCaps(r[k])) r[k]=sentenceCase(r[k]); });
  if(r.status==='Occasional Visit') r.status='Visiting';
  ['welcomeCardDate','followedUpDate','salvationDate','rededicationDate','statusSince'].forEach(k=>{ if(r[k]!==undefined) r[k]=normalizeDateStr(r[k]); });
  if(Array.isArray(r.followUps)) r.followUps.forEach(e=>{ if(typeof e.by==='string'&&isAllCaps(e.by)) e.by=titleCase(e.by); if(typeof e.note==='string'&&isAllCaps(e.note)) e.note=sentenceCase(e.note); });
  return r;
}

function normalizeDateStr(v){
  if(!v || v==='N/A') return 'N/A';
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/); if(m) return `${m[3]}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})\s+([A-Za-z]{3,})\s+(\d{4})$/);
  if(m){ const mi = MONTH_ABBR.findIndex(mm=>m[2].toLowerCase().startsWith(mm.toLowerCase())); if(mi>-1) return `${m[3]}-${String(mi+1).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`; }
  const d = new Date(s); if(!isNaN(d)) return d.toISOString().slice(0,10);
  return 'N/A';
}
function fmtDate(v){
  const c = normalizeDateStr(v); if(c==='N/A') return B.none;
  const [y,mo,da] = c.split('-'); return `${da} ${MONTH_ABBR[parseInt(mo,10)-1]} ${y}`;
}
function fmtDT(iso){
  if(!iso || iso==='N/A') return ''; const d = new Date(iso); if(isNaN(d)) return String(iso);
  let h = d.getHours(); const ap = h>=12?'pm':'am'; h = h%12||12;
  return `${String(d.getDate()).padStart(2,'0')} ${MONTH_ABBR[d.getMonth()]} ${d.getFullYear()} ${String(h).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}${ap}`;
}
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function yearOf(s){ const c=normalizeDateStr(s); return c==='N/A'?null:parseInt(c.slice(0,4),10); }
function monthOf(s){ const c=normalizeDateStr(s); return c==='N/A'?null:parseInt(c.slice(5,7),10); }
function daysBetween(dateStr){ const c=normalizeDateStr(dateStr); if(c==='N/A') return null; const t=new Date(c+'T00:00:00').getTime(); return isNaN(t)?null:Math.floor((Date.now()-t)/86400000); }

}

/* ---------------- API (JSONP reads, confirmed POST writes) ---------------- */
function api(action, opts){
  opts = opts||{};
  return new Promise((resolve, reject)=>{
    const cb = 'towCb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);
    const qs = new URLSearchParams({ action, callback:cb });
    if(state.token && !opts.noToken) qs.set('token', state.token);
    Object.entries(opts.raw||{}).forEach(([k,v])=>qs.set(k,v));
    if(opts.p!==undefined) qs.set('p', JSON.stringify(opts.p));
    const script = document.createElement('script');
    const timer = setTimeout(()=>{ cleanup(); reject(Object.assign(new Error('Timed out — check your connection 连接超时'),{code:'timeout'})); }, opts.timeout||60000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; script.remove(); }
    window[cb] = data=>{
      cleanup();
      if(data && data.ok===false){
        if(data.error==='auth' && !opts.noToken) handleSessionExpired(data.message);
        return reject(Object.assign(new Error(data.message||data.error),{code:data.error}));
      }
      resolve(data);
    };
    script.onerror = ()=>{ cleanup(); reject(Object.assign(new Error('Could not reach the server 无法连接服务器'),{code:'network'})); };
    script.src = SCRIPT_URL+'?'+qs.toString();
    document.body.appendChild(script);
  });
}
function postJson(payload){
  return fetch(SCRIPT_URL,{ method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(payload) }).catch(()=>{});
}
// Saves a profile and waits until the Google Sheet really reflects it (no more "silent" failures).
async function saveRecordConfirmed(rec){
  const baseRev = rec.rev||0;
  postJson({ action:'save', token:state.token, record:rec });
  for(let i=0;i<22;i++){
    await sleep(i===0?1500:1600);
    try{
      const d = await api('detail',{raw:{id:rec.id}});
      if(d.record && d.record.rev > baseRev) return normalizeRecord(d.record);
    }catch(e){ if(e.code==='forbidden'||e.code==='auth') throw e; }
  }
  throw Object.assign(new Error('not confirmed'),{code:'unconfirmed'});
}
async function submitPublicConfirmed(rec){
  postJson({ action:'submitNew', record:rec });
  for(let i=0;i<22;i++){
    await sleep(i===0?1500:1600);
    try{ const d = await api('exists',{raw:{id:rec.id},noToken:true}); if(d.found) return true; }catch(e){}
  }
  throw Object.assign(new Error('not confirmed'),{code:'unconfirmed'});
}

}

/* duplicate rule (same as the server): same contact, or same name + contact within one digit */
function levenshtein(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  const dp=[]; for(let i=0;i<=m;i++){ dp.push([i,...Array(n).fill(0)]); } for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) dp[i][j]= a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
  return dp[m][n];
}
function contactsAreClose(a,b){ const da=digitsOnly(a).replace(/^0+/,''), db=digitsOnly(b).replace(/^0+/,''); if(!da||!db) return false; return da===db || levenshtein(da,db)<=1; }
function isLikelyDuplicate(a,b){
  const ca=normalizeKey(a.contact), cb=normalizeKey(b.contact); if(ca&&cb&&ca===cb) return true;
  const na=normalizeKey(a.name); if(!na||na!==normalizeKey(b.name)) return false;
  return contactsAreClose(a.contact,b.contact);
}
const findDuplicatesOf = rec => state.db.filter(r=>r.id!==rec.id && isLikelyDuplicate(rec,r));
function mergeRecords(primary, other){
  const merged = Object.assign({},primary);
  ['salutation','gender','age','address','guestOf','guestOfContact','welcomeCardDate','specialEventName','stayConnected','remarksWelcome','counselorName','counselorContact','recordType','visitType','firstTimeOrRegular','status','salvationDate','rededicationDate','remarksDecision'].forEach(k=>{
    if(!hasVal(merged[k]) && hasVal(other[k])) merged[k]=other[k];
  });
  if(!merged.sgId && other.sgId) merged.sgId=other.sgId;
  return merged;
}

const inDashPeriod = r=>inPeriod(r,state.filters.dash);
const dashDb = ()=> state.filters.dash.year ? state.db.filter(inDashPeriod) : state.db;
function periodLabel(){
  const f=state.filters.dash; if(!f.year) return 'All Time 所有时间';
  const from=f.fromMonth?MONTH_NAMES[f.fromMonth-1].split(' ')[0]:'Jan', to=f.toMonth?MONTH_NAMES[f.toMonth-1].split(' ')[0]:'Dec';
  return (f.fromMonth||f.toMonth)?`${f.year} (${from}–${to})`:`${f.year}`;
}
const STAT_LABELS = ()=>({total:B.total,en:B.enOnly,ch:B.chOnly,incomplete:B.incomplete,pending:B.pendingFU,weeklyCare:B.weeklyCareStat,careOverdue:B.careOverdue,regular:B.regularStat,visiting:B.visitingStat,followedNoDecision:B.followedNoDecision,noFollow:B.noFollowStat});
function getStatBucket(key){
  const db=dashDb();
  switch(key){
    case 'total': return db; case 'en': return db.filter(r=>r.language==='EN'); case 'ch': return db.filter(r=>r.language==='CH');
    case 'incomplete': return db.filter(r=>!hasVal(r.recordType));
    case 'pending': return db.filter(r=>!hasFollowUp(r)&&!noFollowUpNeeded(r));
    case 'weeklyCare': return db.filter(r=>r.status==='Weekly Care'); case 'careOverdue': return db.filter(isCareOverdue);
    case 'regular': return db.filter(r=>r.status==='Regular'); case 'visiting': return db.filter(r=>r.status==='Visiting');
    case 'followedNoDecision': return db.filter(r=>hasFollowUp(r)&&!hasDecision(r));
    case 'noFollow': return db.filter(noFollowUpNeeded);
  } return [];
}
function memberTable(records, extraCol){
  return `<table style="margin-top:10px;"><thead><tr><th>${B.colName}</th><th>${B.colContact}</th><th>${B.colService}</th><th>${B.colSG}</th>${extraCol?`<th>${extraCol.h}</th>`:''}</tr></thead><tbody>${records.slice(0,200).map(r=>`<tr class="clickable" data-act="open-profile" data-id="${esc(r.id)}"><td>${esc(r.name)}</td><td>${esc(r.contact)}</td><td><span class="tag ${r.language}">${r.language}</span></td><td>${esc(sgLabel(r))||B.none}</td>${extraCol?`<td>${extraCol.f(r)}</td>`:''}</tr>`).join('')}</tbody></table>${records.length>200?`<p class="hint">Showing first 200 of ${records.length}. 仅显示前200名。</p>`:''}`;
}

  return `<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px;"><div class="row" style="justify-content:space-between;"><h3 style="margin:0;font-size:14.5px;color:var(--olive-dark);">${label} — ${recs.length}</h3>${recs.length?`<button class="btn secondary sm" data-act="print-stat">🖨 Print 打印</button>`:''}</div>${recs.length?memberTable(recs,extra):`<p class="empty">${B.noneYet}</p>`}</div>`;

function downloadFile(name,mime,content){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type:mime})); a.download=name; document.body.appendChild(a); a.click();

/* ================= save (add / edit) ================= */
function buildRecordFromForm(form){
  const fd=new FormData(form), g=k=>(fd.get(k)||'').toString().trim(), na=v=>v||'N/A';
  const editing = state.tab==='edit' && state.editingId, old = editing ? (state.detail[state.editingId]||getRecord(state.editingId)) : null;
  const vt=g('visitType');
  const rec = {
    id: editing?state.editingId:uid(), language:g('congregation'), name:g('name'), contact:g('contact'),
    salutation:na(g('salutation')), gender:na(g('gender')), age:na(g('age')), address:na(g('address')),
    recordType:g('recordType'), visitType:vt, firstTimeOrRegular:na(g('firstTimeOrRegular')),
    specialEventName: vt==='Special Event' ? na(g('specialEventName')) : 'N/A',
    welcomeCardDate: g('welcomeCardDate') || (editing?'N/A':todayISO()),
    guestOf:na(g('guestOf')), guestOfContact:na(g('guestOfContact')), stayConnected:na(g('stayConnected')),
    counselorName:na(g('counselorName')), counselorContact:na(g('counselorContact')),
    status:na(g('status')), remarksWelcome:na(g('remarksWelcome')),
    rev: old ? (old.rev||0) : 0,
  };
  if(form.elements.connectedToSG) rec.sgId = g('connectedToSG')==='Yes' ? g('sgId') : '';
  if(!editing) rec.followUps = state.formFollowUps.map(e=>({by:e.by,date:e.date,note:e.note}));
  if(!state.user) rec.enteredBy = g('enteredBy');
  return rec;
}
async function submitVisitorForm(form){
  const fd=new FormData(form), g=k=>(fd.get(k)||'').toString().trim();
  if(!g('name')||!g('contact')||!g('congregation')||!g('recordType')||!g('visitType')){ showToast(B.requiredMsg,4000); return; }
  if(form.elements.connectedToSG && g('connectedToSG')==='Yes' && !g('sgId')){ showToast('Please choose a small group. 请选择小组。',4000); return; }
  const rec=buildRecordFromForm(form), editing=state.tab==='edit'&&state.editingId, btn=$('saveBtn');
  // duplicate warning (new profiles only)
  if(!editing){
    if(state.user){
      const dup=state.db.find(r=>isLikelyDuplicate(rec,r));
      if(dup){
        const c=await modal(`⚠️ Possible duplicate 可能重复<br><br>A similar record already exists:<br>已存在相似的记录：<br><br><b>${esc(dup.name)}</b><br>📞 ${esc(dup.contact)}<br><br>What would you like to do?<br>您希望如何处理？`,
          [{label:'Cancel 取消',value:'cancel'},{label:'Edit Existing 编辑现有记录',value:'edit'},{label:'Save as New Anyway 仍保存为新记录',cls:'clay',value:'save'}]);
        if(c==='cancel') return; if(c==='edit'){ openEdit(dup.id); return; }
      }
    } else {
      try{
        const d=await api('checkDup',{raw:{name:rec.name,contact:rec.contact},noToken:true});
        if(d.dup){
          const c=await modal(`⚠️ A similar visitor may already be registered (${esc(d.maskedName)}).<br>可能已有相似的访客记录（${esc(d.maskedName)}）。<br><br>Please check with a staff member before saving again.<br>重复登记前请先向同工确认。`,
            [{label:'Cancel 取消',value:'cancel'},{label:'Save Anyway 仍要保存',cls:'clay',value:'save'}]);
          if(c==='cancel') return;
        }
      }catch(e){ /* if the check itself fails, don't block the submission */ }
    }
  }
  btn.disabled=true; showToast(B.saving,70000);
  try{
    if(!state.user){
      await submitPublicConfirmed(rec); showToast(B.savedOk,4000);
      state.formFollowUps=[]; state.formStay=''; render(); window.scrollTo(0,0);
    } else {
      const saved=await saveRecordConfirmed(rec); upsertLocal(saved); showToast(B.savedOk,4000);
      if(editing){ state.editingId=null; state.tab='search'; state.profileId=saved.id; if(!state.profileOrigin) state.profileOrigin={tab:'search'}; render(); window.scrollTo(0,0); }
      else { state.formFollowUps=[]; state.formStay=''; render(); window.scrollTo(0,0); }
    }
  }catch(e){
    showToast('⚠️ '+(e.code==='unconfirmed'?B.notConfirmed:esc(e.message)),7000);
    btn.disabled=false;
  }
}

/* ================= delete / merge / weekly care ================= */
async function deleteProfile(id){
  const r=getRecord(id); if(!r) return;
  const ok=await confirmBox(`Delete <b>${esc(r.name)}</b>?<br>The profile is removed from the system and kept only in the Google Sheet “Archive” tab (with who deleted it and when).<br><br>确定删除「${esc(r.name)}」吗？资料将从系统移除，仅保留于谷歌表单「Archive」分页（记录删除人及时间）。`);
  if(!ok) return;
  try{
    await api('deleteRecord',{p:{id}}); state.db=state.db.filter(x=>x.id!==id); delete state.detail[id];
    showToast('Profile deleted 资料已删除');
    if(state.profileId===id){ backFromProfile(); } else render();
  }catch(e){ showToast('⚠️ '+esc(e.message),5000); }
}
async function mergeDup(dupId,primaryId){
  const dup=getRecord(dupId), primary=state.detail[primaryId]||getRecord(primaryId); if(!dup||!primary) return;
  const ok=await confirmBox(`Merge “${esc(dup.name)}” into this record? Missing details (and follow-up entries) are copied over, then the duplicate is removed.<br>确定将「${esc(dup.name)}」合并到此记录吗？缺少的资料与跟进记录将被补上，重复记录将被删除。`,'Merge 合并');
  if(!ok) return;
  showToast(B.saving,90000);
  try{
    const dupFull=await fetchDetail(dupId);
    let rec=await saveRecordConfirmed(Object.assign({},mergeRecords(primary,dup),{rev:primary.rev||0}));
    for(const e of (dupFull.followUps||[]).slice().reverse()){ const r=await api('addFollowUp',{p:{id:primaryId,by:e.by,date:e.date,note:e.note}}); rec=normalizeRecord(r.record); }
    await api('deleteRecord',{p:{id:dupId}});
    state.db=state.db.filter(x=>x.id!==dupId); upsertLocal(rec); refreshProfile(); showToast('Records merged ✓ 记录已合并');
  }catch(e){ showToast('⚠️ '+(e.code==='unconfirmed'?B.notConfirmed:esc(e.message)),6000); }
}
async function careAction(id,keep){
  const rec=state.detail[id]||getRecord(id); if(!rec) return;

}

/* ================= export / import ================= */
const EXPORT_KEYS=['recordType','visitType','firstTimeOrRegular','status','salutation','name','gender','age','contact','address','guestOf','guestOfContact','welcomeCardDate','specialEventName','followedUpBy','followedUpDate','stayConnected','remarksWelcome','counselorName','salvationDate','counselorContact','rededicationDate','remarksDecision','sgName','statusSince','lastUpdatedBy','lastUpdatedOn'];
const EXPORT_HEADERS=['DECISION TYPE','SERVICE ATTENDED','GUEST TYPE','STATUS','SALUTATION','NAME','GENDER','AGE','CONTACT NUMBER','ADDRESS','GUEST OF','CONTACT NUMBER','WELCOME CARD DATE','SPECIAL EVENT NAME','FOLLOWED UP BY','FOLLOWED UP DATE','STAY CONNECTED<br>(CHURCH/ UPDATE/ NO THANK YOU)','REMARKS<br>(WELCOME)',"COUNSELOR'S NAME",'DECISION CARD DATE<br>(SALVATION)','COUNSELOR CONTACT','DECISION CARD DATE<br>(REDEDICATION)','REMARKS<br>(DECISION)','SMALL GROUP','STATUS SINCE','LAST UPDATED BY','LAST UPDATED ON'];
const EXPORT_GROUPS=[['VISITATION DETAILS & STATUS',4],["VISITOR'S PERSONAL INFORMATION",8],['WELCOME CARD DETAILS',6],['DECISION CARD DETAILS',5],['SMALL GROUP & CARE',2],['UPDATE',2]];
const DATE_KEYS=['welcomeCardDate','followedUpDate','salvationDate','rededicationDate','statusSince'];
function exportValue(r,k){
  if(k==='lastUpdatedOn') return fmtDT(r[k])||'N/A'; if(DATE_KEYS.includes(k)) return fmtDate(r[k]); if(k==='sgName') return sgLabel(r)||'N/A';
  return hasVal(r[k]) ? r[k] : 'N/A';
}
function exportCSV(lang){
  const recs=state.db.filter(r=>r.language===lang), q=v=>`"${String(v).replace(/"/g,'""')}"`;
  const csv=[['language',...EXPORT_KEYS].join(','),...recs.map(r=>[lang,...EXPORT_KEYS.map(k=>exportValue(r,k))].map(q).join(','))].join('\n');
  downloadFile(`TOW_${lang==='EN'?'DB_English':'DB_Chinese'}_${todayISO()}.csv`,'text/csv;charset=utf-8;','\uFEFF'+csv);
}
function buildFormattedTable(recs,title){
  const th='font-family:Montserrat,Arial,sans-serif;font-weight:bold;font-size:10pt;border:1px solid #ccc;padding:6px 4px;text-align:center;vertical-align:middle;';
  const td='font-family:Montserrat,Arial,sans-serif;font-size:10pt;border:1px solid #ccc;padding:5px 4px;text-align:center;vertical-align:middle;';
  return `<table style="border-collapse:collapse;"><tr><td colspan="${EXPORT_KEYS.length}" align="center" style="${th}font-size:12pt;color:#5E570D;background:#F1EFD9;">${title} — ${recs.length}</td></tr>
   <tr>${EXPORT_GROUPS.map(([l,s])=>`<td colspan="${s}" align="center" style="${th}background:#F1EFD9;">${l}</td>`).join('')}</tr>
   <tr>${EXPORT_HEADERS.map(h=>`<td align="center" style="${th}background:#F7F4EE;">${h}</td>`).join('')}</tr>
   ${recs.map(r=>`<tr>${EXPORT_KEYS.map(k=>`<td align="center" style="${td}">${esc(exportValue(r,k))}</td>`).join('')}</tr>`).join('')}</table><br>`;
}
function exportXls(langs,fname){
  const html='<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body>'+langs.map(l=>buildFormattedTable(state.db.filter(r=>r.language===l),l==='EN'?'DB_English':'DB_Chinese')).join('')+'</body></html>';
  downloadFile(`${fname}_${todayISO()}.xls`,'application/vnd.ms-excel;charset=utf-8;',html);
}
function parseCSV(text){
  const rows=[]; let row=[],cur='',inQ=false; text=text.replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=ch; }
    else if(ch==='"') inQ=true; else if(ch===','){ row.push(cur);cur=''; } else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cur);cur=''; rows.push(row);row=[]; } else cur+=ch; }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); } return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function mapHeader(h){
  const u=h.replace(/\s+/g,' ').trim().toUpperCase(); if(!u) return null;
  const direct=['recordType','visitType','firstTimeOrRegular','status','salutation','name','gender','age','contact','address','guestOf','guestOfContact','welcomeCardDate','specialEventName','followedUpBy','followedUpDate','stayConnected','remarksWelcome','counselorName','salvationDate','counselorContact','rededicationDate','remarksDecision'].find(k=>k.toUpperCase()===u);
  if(direct) return direct;
  if(u==='SALUTATION') return 'salutation'; if(u==='NAME') return 'name'; if(u==='GENDER') return 'gender'; if(u==='AGE') return 'age'; if(u==='ADDRESS') return 'address'; if(u==='GUEST OF') return 'guestOf';
  if(u.includes('CONTACT NUMBER')) return '__contact'; if(u.includes('WELCOME CARD DATE')) return 'welcomeCardDate'; if(u.includes('SPECIAL EVENT')) return 'specialEventName';
  if(u.includes('FOLLOWED UP BY')) return 'followedUpBy'; if(u.includes('FOLLOW')&&u.includes('DATE')) return 'followedUpDate'; if(u.includes('STAY CONNECTED')) return 'stayConnected';
  if(u.includes('REMARKS')) return '__remarks'; if(u.includes('COUNSELOR')&&u.includes('CONTACT')) return 'counselorContact'; if(u.includes('COUNSELOR')) return 'counselorName';
  if(u.includes('SALVATION')) return 'salvationDate'; if(u.includes('REDEDICATION')) return 'rededicationDate'; if(u.includes('DECISION TYPE')) return 'recordType';
  if(u.includes('SERVICE ATTENDED')) return 'visitType'; if(u.includes('GUEST TYPE')) return 'firstTimeOrRegular'; if(u==='STATUS') return 'status'; return null;
}
async function importCSV(file,lang){
  if(!file) return;
  const rows=parseCSV(await file.text()); const hi=rows.findIndex(r=>r.some(c=>/^name$/i.test(c.trim())));
  if(hi<0){ showToast('Could not find a NAME column. 找不到「NAME」栏。',5000); return; }
  let cSeen=0,rSeen=0; const map=rows[hi].map(h=>{ const k=mapHeader(h); if(k==='__contact') return cSeen++===0?'contact':'guestOfContact'; if(k==='__remarks') return rSeen++===0?'remarksWelcome':'remarksDecision'; return k; });
  const seen=new Set(), recs=[];
  rows.slice(hi+1).forEach(cells=>{
    const o={}; map.forEach((k,i)=>{ if(k&&cells[i]!==undefined){ const v=cells[i].trim(); if(v&&v.toUpperCase()!=='N/A') o[k]=v; } });
    if(!o.name) return;
    ['welcomeCardDate','followedUpDate','salvationDate','rededicationDate'].forEach(k=>{ if(o[k]) o[k]=normalizeDateStr(o[k]); });
    if(o.status==='Occasional Visit') o.status='Visiting';
    const sig=normalizeKey(o.name)+'|'+normalizeKey(o.contact||''); if(seen.has(sig)) return; seen.add(sig);
    const existing=state.db.find(r=>r.language===lang && normalizeKey(r.name)===normalizeKey(o.name) && normalizeKey(r.contact)===normalizeKey(o.contact||''));
    const rec=Object.assign({language:lang,contact:'N/A'},o,{id:existing?existing.id:uid(),rev:existing?(existing.rev||0):0});
    if(!existing && o.followedUpBy) rec.followUps=[{by:o.followedUpBy,date:o.followedUpDate||todayISO(),note:''}];
    recs.push(rec);
  });
  if(!recs.length){ showToast('No records found in this file. 文件中没有记录。',4000); return; }
  const ok=await confirmBox(`Import <b>${recs.length}</b> records into ${lang==='EN'?'DB_English':'DB_Chinese'}? Existing matching profiles are updated, not duplicated.<br>导入 <b>${recs.length}</b> 笔资料？相符的资料将被更新而不会重复。`,'Import 导入');
  if(!ok) return;
  const CH=15;
  for(let i=0;i<recs.length;i+=CH){
    const chunk=recs.slice(i,i+CH), last=chunk[chunk.length-1];
    showToast(`Importing 导入中… ${Math.min(i+CH,recs.length)} / ${recs.length}`,90000);
    postJson({action:'saveMany',token:state.token,records:chunk});
    let done=false; for(let t=0;t<40&&!done;t++){ await sleep(2000); try{ const d=await api('detail',{raw:{id:last.id}}); if(d.record && d.record.rev>(last.rev||0)) done=true; }catch(e){} }
    if(!done){ showToast('⚠️ Import could not be confirmed — stopped. 导入无法确认，已停止。',7000); await loadData(); return; }
  }
  await loadData(); showToast(`Imported ✓ 已导入 ${recs.length} 笔`,5000);
}

/* ================= admin tools ================= */
async function loadTools(){
  state.admin={};
  const jobs={ users:api('users').then(r=>r.users), backups:api('backupList').then(r=>r.backups), archive:api('archiveList').then(r=>r.archive), log:api('loginLog').then(r=>r.log) };
  for(const [k,p] of Object.entries(jobs)){ p.then(v=>{ state.admin[k]=v; if(state.tab==='tools') render(); }).catch(e=>{ state.admin[k]=[]; if(e.code!=='auth') showToast('⚠️ '+esc(e.message),4000); if(state.tab==='tools') render(); }); }
}
async function saveUserForm(form){
  const fd=new FormData(form);
  const p={ id:fd.get('id').trim(), name:fd.get('name').trim(), role:fd.get('role'), sgs:fd.getAll('sgs'), active:form.elements.active.checked, password:fd.get('password') };
  if(p.role!=='sgleader') p.sgs=[];
  try{ const r=await api('saveUser',{p}); state.admin.users=r.users; showToast('User saved ✓ 用户已保存'); render(); }catch(e){ showToast('⚠️ '+esc(e.message),5000); }
}
async function updateUser(id,patch,msg){
  const u=(state.admin.users||[]).find(x=>x.id===id); if(!u) return;
  try{ const r=await api('saveUser',{p:Object.assign({id:u.id,name:u.name,role:u.role,sgs:u.sgs,active:u.active},patch)}); state.admin.users=r.users; showToast(msg); render(); }
  catch(e){ showToast('⚠️ '+esc(e.message),5000); }
}

  'user-reset': async el=>{ const pw=await promptBox(`New password for <b>${esc(el.dataset.id)}</b> (min 6 characters)<br>${esc(el.dataset.id)} 的新密码（至少6个字符）`,'text'); if(pw) updateUser(el.dataset.id,{password:pw},'Password reset ✓ 密码已重设'); },

document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const fn=ACT[el.dataset.act]; if(fn){ e.preventDefault(); fn(el,e); } });
document.addEventListener('input',e=>{
  const el=e.target; if(el.classList&&el.classList.contains('digits-only')) el.value=el.value.replace(/[^0-9]/g,'');
  const k=el.dataset&&el.dataset.in; if(!k||el.tagName==='SELECT'||el.type==='file'||el.type==='checkbox') return; if(INPUT[k]) INPUT[k](el,e);
});
document.addEventListener('change',e=>{
  const el=e.target, k=el.dataset&&el.dataset.in; if(!k) return;
  if(el.tagName==='SELECT'||el.type==='file'||el.type==='checkbox'){ if(INPUT[k]) INPUT[k](el,e); }
});
document.addEventListener('submit',e=>{
  e.preventDefault(); const f=e.target;
  const fid=f.getAttribute('id'); // (not f.id — the user form has an input named "id" that would shadow it)
  if(fid==='visitorForm') submitVisitorForm(f); else if(fid==='loginForm') doLogin(f); else if(fid==='userForm') saveUserForm(f);
});

/* ================= boot ================= */
(async function boot(){
  render();
  const t=sessionStorage.getItem('towToken');
  if(t){ state.token=t; await loadData(); if(state.user && !tabAllowed(state.tab)){ state.tab=landingTab(state.user); render(); } }
})();
