<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TOW New Comer & Member's Database</title>
<style>
  :root{
    --bg:#F7F4EE;
    --panel:#FFFFFF;
    --ink:#2A2C27;
    --muted:#7A7A6F;
    --olive:#8C8014;
    --olive-dark:#5E570D;
    --gold:#C6963C;
    --clay:#B25B4A;
    --line:#E4DFD2;
    --radius:10px;
    font-family:"Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  h1,h2,h3,.display{ font-family: Georgia, "Iowan Old Style", "Songti SC", serif; letter-spacing:.2px; }
  .app{max-width:1180px;margin:0 auto;padding:22px 20px 60px;}
  header.top{
    display:flex;justify-content:space-between;align-items:center;gap:16px;
    padding-bottom:16px;border-bottom:2px solid var(--olive);margin-bottom:18px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:16px;}
  .brand img{height:72px;width:auto;display:block;}
  .titleblock h1{font-size:18px;margin:0;color:var(--olive-dark);line-height:1.3;font-weight:700;}
  .titleblock .cn-line{font-size:18px;margin:0;color:var(--olive-dark);line-height:1.3;font-weight:700;font-family:Georgia,"Songti SC","Noto Serif SC",serif;}
  .sheetlink{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--olive-dark);
    text-decoration:none;border:1px solid var(--olive); border-radius:999px;padding:7px 14px;
  }
  .sheetlink:hover{background:#F1EFD9;}

  nav.tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
  nav.tabs button{
    border:1px solid var(--line);background:var(--panel);color:var(--ink);
    padding:9px 15px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;
    display:flex;align-items:center;gap:6px;
  }
  nav.tabs button.active{background:var(--olive-dark);border-color:var(--olive-dark);color:#fff;}
  nav.tabs button .lock{font-size:11px;opacity:.7;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:18px;}
  .card h2{margin-top:0;font-size:18px;color:var(--olive-dark);padding-bottom:10px;border-bottom:2px solid #EFE9D8;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600;min-height:2.5em;line-height:1.25;}
  label .cn{color:#9c8f4a;}
  input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-size:14px;background:#FCFBF8;color:var(--ink);
  }
  textarea{min-height:56px;font-family:inherit;resize:vertical;}
  .field{margin-bottom:2px;}
  fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px 16px;margin:0 0 18px;background:#FDFCF9;}
  legend{
    padding:5px 14px;font-weight:700;color:#fff;font-size:12.5px;letter-spacing:.4px;text-transform:uppercase;
    background:var(--olive);border-radius:999px;
  }
  .radio-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px;}
  .radio-row label{display:flex;align-items:center;gap:6px;font-weight:500;color:var(--ink);font-size:13.5px;}
  .btn{ border:none;padding:10px 20px;border-radius:7px;font-weight:700;cursor:pointer;font-size:14px; background:var(--olive); color:#fff; }
  .btn.secondary{background:#fff;color:var(--olive-dark);border:1px solid var(--olive);}
  .btn.gold{background:var(--gold);}
  .btn.clay{background:var(--clay);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.3px;}
  .tag.EN{background:#E3EEEA;color:#1E4038;}
  .tag.CH{background:#F5E9D4;color:#8A5E1A;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{padding:8px 9px;text-align:left;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover{background:#FBF7EF;}
  td.clickable{cursor:pointer;color:var(--olive-dark);font-weight:600;}
  td.clickable:hover{text-decoration:underline;}
  .badge-danger{color:var(--clay);font-weight:700;}
  .empty{color:var(--muted);font-style:italic;padding:14px 0;}
  .lockscreen{max-width:380px;margin:60px auto;text-align:center;}
  .lockscreen input{margin-bottom:12px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:center;}
  .stat.clickable{cursor:pointer;transition:box-shadow .15s,border-color .15s;}
  .stat.clickable:hover{box-shadow:0 2px 10px rgba(0,0,0,.08);border-color:var(--olive);}
  .stat .num{font-family:Georgia,serif;font-size:32px;color:var(--olive-dark);}
  .stat .lbl{font-size:12px;color:var(--muted);margin-top:4px;}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:18px;}
  .profile-card{border:2px solid var(--olive);border-radius:var(--radius);padding:0;overflow:hidden;max-width:480px;}
  .profile-card .ph{background:var(--olive-dark);color:#fff;padding:16px 20px;}
  .profile-card .ph h3{margin:0;font-size:19px;}
  .profile-card .sec{padding:14px 20px;border-top:1px solid var(--line);}
  .profile-card .sec h4{margin:0 0 8px;font-size:12.5px;letter-spacing:.5px;color:var(--gold);text-transform:uppercase;}
  .profile-card .kv{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;border-bottom:1px dashed #EFE9DC;gap:14px;}
  .profile-card .kv span:first-child{color:var(--muted);flex:0 0 auto;}
  .profile-card .kv span:last-child{text-align:right;}
  .sop-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:760px){.sop-cols{grid-template-columns:1fr;} .brand img{height:44px;}}
  .sop-step{display:flex;gap:12px;}
  .sop-step .n{ flex:0 0 30px;height:30px;border-radius:50%;background:var(--olive);color:#fff;font-weight:700; display:flex;align-items:center;justify-content:center;font-size:13px; }
  .sop-step .body{flex:1;padding-bottom:18px;border-left:2px solid var(--line);margin-left:15px;padding-left:20px;margin-top:-2px;}
  .sop-step:last-child .body{border-left:2px solid transparent;}
  .sop-step .body h5{margin:0 0 4px;font-size:14.5px;color:var(--olive-dark);}
  .sop-step .body p{margin:0;font-size:13px;color:#565650;line-height:1.5;}
  .sop-title{font-family:Georgia,serif;color:var(--olive-dark);font-size:16px;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--gold);}
  .threshold{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);margin-bottom:14px;}
  .threshold input{width:70px;}
  .hint{font-size:12px;color:#6B6A5C;margin:10px 0 14px;background:#FBF7EC;border-left:3px solid var(--gold);padding:9px 12px;border-radius:0 6px 6px 0;line-height:1.55;}
  .entered-by-bar{
    display:flex;align-items:center;gap:12px;background:#F1EFD9;border:1px solid #E0D8B0;border-radius:8px;
    padding:12px 16px;margin-bottom:16px;flex-wrap:wrap;
  }
  .entered-by-bar label{margin:0;font-weight:700;font-size:13px;color:var(--olive-dark);white-space:nowrap;}
  .entered-by-bar input{flex:1;min-width:180px;margin:0;background:#fff;}
  .toolbar-group{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;}
  .toolbar-group:first-of-type{border-top:none;margin-top:14px;padding-top:0;}
  .toolbar-group .tg-label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;}
  .toolbar-group.danger .tg-label{color:var(--clay);}
  #toast{ position:fixed;bottom:24px;left:50%;transform:translateX(-50%); background:var(--olive-dark);color:#fff;padding:10px 22px;border-radius:14px;font-size:13.5px; opacity:0;pointer-events:none;transition:opacity .25s; z-index:999; text-align:center; line-height:1.5; max-width:90vw; }
  .modal-overlay{ position:fixed;inset:0;background:rgba(42,44,39,0.55);display:flex;align-items:center;justify-content:center;z-index:1200;padding:20px; }
  .modal-box{ background:#fff;border-radius:var(--radius);padding:22px;max-width:380px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25); }
  .modal-msg{ font-size:14px;line-height:1.6;margin:0 0 16px;white-space:pre-line; }
  .filterbar{ display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:14px;background:#FBF9F3;border:1px solid var(--line);border-radius:8px;padding:12px; }
  .filterbar input{ font-size:12.5px;padding:6px 8px; }
  .filterbar .flabel{ font-size:10.5px;color:var(--muted);font-weight:700;margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px; }
  .section-head{ background:var(--olive-dark);color:#fff;padding:12px 18px;border-radius:8px 8px 0 0;margin:-22px -22px 16px; }
  .section-head h2{ color:#fff;margin:0;border:none;padding:0; }
  .section-head p{ color:#E7E4D4;margin:4px 0 0;font-size:12.5px; }
  .section-head.clickable-section{ cursor:pointer; }
  .section-head.clickable-section:hover{ background:#26430D; }
  .toggle-arrow{ float:right;font-size:13px;opacity:.85; }
  #toast.show{opacity:1;}
  input[type=file]{font-size:12.5px;}
  .print-header{display:none;}
  @media print{
    @page{ size: A4; margin: 14mm; }
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;top:0;left:0;width:100%;display:flex;flex-direction:column;align-items:center;}
    .print-header{
      display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:18px;
      padding-bottom:12px;border-bottom:2px solid var(--olive);width:100%;max-width:480px;
    }
    .print-header img{height:46px;width:auto;}
    .print-header .pt{font-family:Georgia,serif;font-weight:700;color:var(--olive-dark);font-size:15px;line-height:1.35;}
    .profile-card{max-width:480px;width:100%;}
  }
</style>
</head>

function daysSince(dateStr){
  if(!dateStr || dateStr==='N/A') return null;
  const d = new Date(dateStr); if(isNaN(d)) return null;
  return Math.max(0, Math.floor((new Date() - d)/(1000*60*60*24)));
}

/* Custom confirm/prompt modals — some embedded browser views block native
   window.confirm/prompt (or silently no-op them), so every "are you sure?"
   in this app goes through these instead, guaranteeing they always show up. */
function showConfirmModal(message){
  return new Promise((resolve)=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <p class="modal-msg">${message}</p>
        <div class="row" style="justify-content:flex-end;">
          <button class="btn secondary" id="modalCancelBtn">Cancel 取消</button>
          <button class="btn clay" id="modalOkBtn">Delete 删除</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#modalCancelBtn').onclick = ()=>{ overlay.remove(); resolve(false); };
    overlay.querySelector('#modalOkBtn').onclick = ()=>{ overlay.remove(); resolve(true); };
  });
}
function showPromptModal(message){
  return new Promise((resolve)=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <p class="modal-msg">${message}</p>
        <input type="password" id="modalPromptInput" style="margin-bottom:14px;">
        <div class="row" style="justify-content:flex-end;">
          <button class="btn secondary" id="modalCancelBtn">Cancel 取消</button>
          <button class="btn" id="modalOkBtn">OK 确定</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const input = overlay.querySelector('#modalPromptInput');
    input.focus();
    const submit = ()=>{ const v = input.value; overlay.remove(); resolve(v); };
    overlay.querySelector('#modalCancelBtn').onclick = ()=>{ overlay.remove(); resolve(null); };
    overlay.querySelector('#modalOkBtn').onclick = submit;
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  });
}

/* Debounce + focus-safe partial update — replaces only a sub-container's
   innerHTML instead of the whole page, so inputs never lose focus mid-type. */
function debounce(fn, ms){
  let timer;
  return (...args)=>{ clearTimeout(timer); timer = setTimeout(()=>fn(...args), ms); };
}
function partialUpdate(containerId, html){
  const el = document.getElementById(containerId);
  if(!el) return;
  el.innerHTML = html;
  attachRowHandlers();
}

/* ---------------- Storage ---------------- */
async function loadAll(){
  // Settings: local cache is just a convenience; the sync URL always defaults to the
  // one baked into this file so it can never "disappear" after a refresh.
  try{
    const s = await window.storage.get('towdb-settings', true);
    const cached = s ? JSON.parse(s.value) : {};
    state.settings = Object.assign({ thresholdDays: 14, scriptUrl: DEFAULT_SCRIPT_URL }, cached);
    if(!state.settings.scriptUrl) state.settings.scriptUrl = DEFAULT_SCRIPT_URL;
  }catch(e){ state.settings = { thresholdDays: 14, scriptUrl: DEFAULT_SCRIPT_URL }; }

  // Primary source of truth: the live Google Sheet (via Apps Script). This is what
  // makes data survive a refresh even on a browser with no working local storage.
  let liveData = null;
  if(state.settings.scriptUrl){
    state.syncStatus = 'syncing';
    try{ liveData = await fetchFromSheet(state.settings.scriptUrl); }catch(e){ liveData = null; }
  }

  if(liveData){
    state.db = [...(liveData.EN||[]), ...(liveData.CH||[])].filter(Boolean).map(r => Object.assign({ id: uid() }, r));
    state.syncStatus = 'ok';
    saveDB(); // best-effort local cache, so a later offline load still shows the last-known data
  } else {
    state.syncStatus = state.settings.scriptUrl ? 'error' : 'idle';
    // fall back to whatever was last cached locally in this browser
    try{
      const r = await window.storage.get('towdb-visitors', true);
      state.db = (r ? JSON.parse(r.value) : []).filter(Boolean);
    }catch(e){ state.db = []; }
  }

  state.loaded = true;
  render();
}
async function fetchFromSheet(url){
  // Apps Script's ContentService responses never include CORS headers, so a normal
  // fetch() GET here is silently blocked by the browser every time — this is a
  // hard Apps Script limitation, not something fixable via deployment settings.
  // JSONP (loading via a <script> tag) sidesteps CORS entirely and is the
  // standard workaround for reading data back out of an Apps Script web app.
  return new Promise((resolve, reject)=>{
    const cbName = 'towDbCb_' + Date.now() + '_' + Math.floor(Math.random()*100000);
    const timeoutId = setTimeout(()=>{ cleanup(); reject(new Error('timeout')); }, 45000);
    function cleanup(){
      clearTimeout(timeoutId);
      delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = (data)=>{ cleanup(); resolve(data); };
    const script = document.createElement('script');
    const sep = url.includes('?') ? '&' : '?';
    script.src = url + sep + 'action=list&callback=' + cbName;
    script.onerror = ()=>{ cleanup(); reject(new Error('script load error')); };
    document.body.appendChild(script);
  });
}
async function saveDB(){
  try{ await window.storage.set('towdb-visitors', JSON.stringify(state.db), true); }
  catch(e){ /* local cache is best-effort only — the sheet is the real save */ }
}
async function saveSettings(){
  try{ await window.storage.set('towdb-settings', JSON.stringify(state.settings), true); }
  catch(e){}
}
async function syncToGoogleSheet(rec, action){
  if(!state.settings.scriptUrl) return false;
  const payload = action ? Object.assign({ action }, rec) : rec;
  // POST responses from Apps Script hit the same CORS wall as GET does — the
  // request itself still reaches the server and writes successfully, but the
  // browser won't let us read the confirmation back. Go straight to no-cors
  // (fire-and-forget) instead of wasting a round trip on a normal fetch first.
  try{
    await fetch(state.settings.scriptUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' }, // avoids a CORS preflight
      body: JSON.stringify(payload)
    });
    return true;
  }catch(e){
    return false;
  }
}

function render(){
  const app = document.getElementById('app');
  if(!state.loaded){
    app.innerHTML = `<div style="text-align:center;padding:90px 20px;color:#7A7A6F;">
      <div style="width:34px;height:34px;border:3px solid #E4DFD2;border-top-color:var(--olive);border-radius:50%;margin:0 auto 16px;animation:spin 0.9s linear infinite;"></div>
      <p style="margin:0;font-size:14px;">Loading live data from your Google Sheet…<br>正在从您的谷歌表单读取实时数据…</p>
      <p style="margin:10px 0 0;font-size:12px;color:#A6A296;">This can take up to a minute on the first load. 首次载入可能需要长达一分钟。</p>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg);}}</style>`;
    return;
  }
  app.innerHTML = `${renderHeader()}${renderTabs()}${renderBody()}`;
  attachHandlers();
}

function applyDbFilters(records, lang){
  const f = state.filters[lang] || {};
  return records.filter(r=>{
    if(f.name && !(r.name||'').toLowerCase().includes(f.name.toLowerCase())) return false;
    if(f.contact){
      const qd = digitsOnly(f.contact);
      if(qd ? !digitsOnly(r.contact).includes(qd) : !(r.contact||'').toLowerCase().includes(f.contact.toLowerCase())) return false;
    }
    if(f.welcomeDate && !(r.welcomeCardDate||'').toLowerCase().includes(f.welcomeDate.toLowerCase())) return false;
    if(f.followedUpBy && !(r.followedUpBy||'').toLowerCase().includes(f.followedUpBy.toLowerCase())) return false;
    if(f.decisionDate){
      const dd = f.decisionDate.toLowerCase();
      if(!(r.salvationDate||'').toLowerCase().includes(dd) && !(r.rededicationDate||'').toLowerCase().includes(dd)) return false;
    }
    if(f.updatedOn && !fmtDT(r.lastUpdatedOn).toLowerCase().includes(f.updatedOn.toLowerCase())) return false;
    return true;
  });
}

function renderDbTableRows(lang){
  const all = state.db.filter(r=>r.language===lang).sort((a,b)=>((a&&a.name)||'').localeCompare((b&&b.name)||''));

function hasDecision(r){ return (r.salvationDate && r.salvationDate!=='N/A') || (r.rededicationDate && r.rededicationDate!=='N/A'); }
function hasFollowUp(r){ return r.followedUpBy && r.followedUpBy!=='N/A'; }
function hasWelcome(r){ return r.welcomeCardDate && r.welcomeCardDate!=='N/A'; }
function getStatBucket(key){
  const db = state.db;
  switch(key){
    case 'total': return db;
    case 'en': return db.filter(r=>r.language==='EN');
    case 'ch': return db.filter(r=>r.language==='CH');
    case 'noWelcome': return db.filter(r => !hasDecision(r) && !hasFollowUp(r) && !hasWelcome(r));
    case 'pending': return db.filter(r => !hasDecision(r) && !hasFollowUp(r) && hasWelcome(r));
    case 'followedNoDecision': return db.filter(r => !hasDecision(r) && hasFollowUp(r));
    case 'decided': return db.filter(hasDecision);
    default: return [];
  }
}
function renderStatDetail(key){
  if(!key) return '';
  const records = getStatBucket(key);
  const labels = { total:B.total, en:B.enOnly, ch:B.chOnly, noWelcome:'No Welcome Card Yet 尚无欢迎卡', pending:B.pendingFU, followedNoDecision:'Followed Up, No Decision 已跟进未决志', decided:B.decided };
  return `
  <div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px;">
    <h3 style="margin:0 0 10px;font-size:14.5px;color:var(--olive-dark);">${labels[key]||''} — ${records.length}</h3>
    ${records.length ? `<table><thead><tr><th>${B.colName}</th><th>${B.colContact}</th><th>${B.colService}</th></tr></thead>
      <tbody>${records.slice(0,200).map(r=>`<tr class="clickable" data-profileid="${r.id}"><td>${esc(r.name)}</td><td>${esc(r.contact)}</td><td><span class="tag ${r.language}">${r.language}</span></td></tr>`).join('')}</tbody></table>
      ${records.length>200 ? `<p class="hint">Showing first 200 of ${records.length}. 仅显示前200名，共${records.length}名。</p>` : ''}`
      : `<p class="empty">${B.noneYet}</p>`}
  </div>`;
}

function esc(v){ return v===undefined || v===null ? '' : String(v).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function digitsOnly(s){ return (s||'').toString().replace(/[^0-9]/g,''); }
function matchesQuery(r, q){
  if(!r) return false;
  const qLower = q.trim().toLowerCase();
  if(!qLower) return false;
  // String(...) guards against a record whose name/contact somehow ended up as a
  // number or other non-string value (e.g. from an old bad import) — without this,
  // a single such record throws mid-filter and silently kills the whole search.
  const nameHit = String(r.name||'').toLowerCase().includes(qLower);
  const qDigits = digitsOnly(q);
  const contactHit = qDigits ? digitsOnly(r.contact).includes(qDigits) : String(r.contact||'').toLowerCase().includes(qLower);
  return nameHit || contactHit;
}
function fmtDT(iso){
  if(!iso) return '';
  const d = new Date(iso); if(isNaN(d)) return '';
  return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

const CSV_COLS = ['language','salutation','name','gender','age','contact','email','address','guestOf','guestOfContact',
  'welcomeCardDate','specialEventName','followedUpBy','followedUpDate','stayConnected','remarksWelcome',
  'counselorName','salvationDate','rededicationDate','remarksDecision','lastUpdatedBy','lastUpdatedOn'];

function exportCSV(records, filename){
  const header = CSV_COLS.join(',');
  const rows = records.map(r => CSV_COLS.map(c => `"${(r[c]||'').toString().replace(/"/g,'""')}"`).join(','));
  const csv = [header, ...rows].join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

/* Formatted Excel-ready export (.xls via HTML table) — true CSV cannot carry fonts,
   colors, borders or merged headers, so this builds a styled file that opens directly
   in Excel/Sheets with the requested look already applied. */
const FIELD_HEADERS = [
  'SALUTATION','NAME','GENDER','AGE','CONTACT NUMBER','EMAIL','ADDRESS','GUEST OF','CONTACT NUMBER',
  'WELCOME CARD DATE','SPECIAL EVENT NAME','FOLLOWED UP BY','FOLLOWED UP DATE',
  'STAY CONNECTED<br>(CHURCH/ UPDATE/ NO THANK YOU)','REMARKS<br>(WELCOME)',
  "COUNSELOR'S NAME",'DECISION CARD DATE<br>(SALVATION)','DECISION CARD DATE<br>(REDEDICATION)','REMARKS<br>(DECISION)',
  'LAST UPDATED BY','LAST UPDATED ON'
];
const FIELD_KEYS = CSV_COLS.slice(1); // same 21 keys, in the same order, minus 'language'
const CATEGORY_GROUPS = [["VISITOR'S PERSONAL INFORMATION",9],['WELCOME CARD DETAILS',6],['DECISION CARD DETAILS',4],['UPDATE',2]];

function buildFormattedTable(records, sectionTitle){
  const th = 'font-family:Montserrat,Arial,sans-serif;font-weight:bold;font-size:10pt;color:#000000;border:1px solid #cccccc;padding:6px 4px;text-align:center;vertical-align:middle;mso-font-charset:0;';
  const td = 'font-family:Montserrat,Arial,sans-serif;font-size:10pt;color:#000000;border:1px solid #cccccc;padding:5px 4px;text-align:center;vertical-align:middle;mso-font-charset:0;';
  let html = `<table style="border-collapse:collapse;width:100%;margin-bottom:28px;">`;
  html += `<tr><td colspan="21" align="center" valign="middle" style="text-align:center;font-family:Montserrat,Arial,sans-serif;font-weight:bold;font-size:12pt;color:#5E570D;background:#F1EFD9;border:1px solid #cccccc;padding:8px 0;">${sectionTitle} — ${records.length}</td></tr>`;
  html += `<tr>` + CATEGORY_GROUPS.map(([label,span])=>`<td colspan="${span}" align="center" valign="middle" style="${th}background:#F1EFD9;">${label}</td>`).join('') + `</tr>`;
  html += `<tr>` + FIELD_HEADERS.map(h=>`<td align="center" valign="middle" style="${th}background:#F7F4EE;">${h}</td>`).join('') + `</tr>`;
  records.forEach(r=>{
    html += `<tr>` + FIELD_KEYS.map(k=>`<td align="center" valign="middle" style="${td}">${esc(r[k]) || 'N/A'}</td>`).join('') + `</tr>`;
  });
  html += `</table>`;
  return html;
}

function parseCSV(text){
  // simple CSV parser handling quoted fields
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(field.length || row.length){ row.push(field); rows.push(row); row=[]; field=''; }
        if(c==='\r' && text[i+1]==='\n') i++;
      } else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function normalizeHeaderCell(s){
  return (s||'').replace(/\n/g,' ').replace(/\s+/g,' ').trim().toUpperCase();
}

// Finds the header row (the row containing a cell that is exactly "NAME"),
// then maps each column index to an internal field key, handling the sheet's
// duplicate column names (CONTACT NUMBER appears twice, REMARKS appears twice)
// by assigning them in the order they appear, left to right.
function detectHeaderMapping(rows){
  let headerRowIdx = rows.findIndex(row => row.some(c => normalizeHeaderCell(c) === 'NAME'));
  if(headerRowIdx === -1) headerRowIdx = 0;
  const header = rows[headerRowIdx].map(normalizeHeaderCell);
  const colMap = {};
  let contactSeen = 0, remarksSeen = 0;
  header.forEach((h,idx)=>{
    if(!h) return;
    if(h === 'SALUTATION') colMap[idx] = 'salutation';
    else if(h === 'NAME') colMap[idx] = 'name';
    else if(h === 'GENDER') colMap[idx] = 'gender';
    else if(h === 'AGE') colMap[idx] = 'age';
    else if(h.includes('CONTACT NUMBER')){ colMap[idx] = contactSeen===0 ? 'contact' : 'guestOfContact'; contactSeen++; }
    else if(h === 'EMAIL') colMap[idx] = 'email';
    else if(h === 'ADDRESS') colMap[idx] = 'address';
    else if(h === 'GUEST OF') colMap[idx] = 'guestOf';
    else if(h.includes('WELCOME CARD DATE')) colMap[idx] = 'welcomeCardDate';
    else if(h.includes('SPECIAL EVENT')) colMap[idx] = 'specialEventName';
    else if(h.includes('FOLLOWED UP BY')) colMap[idx] = 'followedUpBy';
    else if(h.includes('FOLLOWED UP DATE') || h.includes('FOLLOW-UP DATE') || h.includes('FOLLOW UP DATE')) colMap[idx] = 'followedUpDate';
    else if(h.includes('STAY CONNECTED')) colMap[idx] = 'stayConnected';
    else if(h.includes('REMARKS')){ colMap[idx] = remarksSeen===0 ? 'remarksWelcome' : 'remarksDecision'; remarksSeen++; }
    else if(h.includes("COUNSELOR")) colMap[idx] = 'counselorName';
    else if(h.includes('SALVATION')) colMap[idx] = 'salvationDate';
    else if(h.includes('REDEDICATION')) colMap[idx] = 'rededicationDate';
    else if(h.includes('LAST UPDATED BY')) colMap[idx] = 'lastUpdatedBy';
    else if(h.includes('LAST UPDATED ON')) colMap[idx] = 'lastUpdatedOn';
  });
  return { headerRowIdx, colMap };
}

function normalizeKey(v){ return (v||'').toString().trim().toLowerCase().replace(/[\s\-]/g,''); }

function importCSVFile(file, lang){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    const rows = parseCSV(e.target.result);
    if(!rows.length) return;
    const { headerRowIdx, colMap } = detectHeaderMapping(rows);
    let added = 0, updated = 0, skipped = 0;
    const toSync = [];
    for(let i=headerRowIdx+1;i<rows.length;i++){
      const cells = rows[i];
      if(cells.every(c=>!c || !c.trim())) continue;
      const fields = {};
      Object.entries(colMap).forEach(([idx,key])=>{ fields[key] = (cells[idx] !== undefined ? cells[idx].trim() : '') || 'N/A'; });
      if(!fields.name || fields.name==='N/A'){ skipped++; continue; }
      fields.language = lang; // always force this tab's own congregation, regardless of any value in the file
      const now = new Date().toISOString();
      // Duplicate check: same congregation + same contact number (or same name if contact is N/A)
      // Match on NAME + CONTACT together — matching on contact alone would wrongly
      // merge different family members who share one household phone number.
      const dupeKey = (fields.contact && fields.contact!=='N/A')
        ? normalizeKey(fields.name) + '|' + normalizeKey(fields.contact)
        : null;
      let existing = null;
      if(dupeKey){
        existing = state.db.find(r=> r.language===lang && (normalizeKey(r.name)+'|'+normalizeKey(r.contact))===dupeKey);
      } else {
        existing = state.db.find(r=> r.language===lang && normalizeKey(r.name)===normalizeKey(fields.name));
      }
      if(existing){
        Object.assign(existing, fields, { lastUpdatedOn: now, lastUpdatedBy: 'CSV import' });
        toSync.push(existing);
        updated++;
      } else {
        const rec = Object.assign({ id: uid(), createdAt: now }, fields, { lastUpdatedOn: now, lastUpdatedBy: 'CSV import' });
        state.db.push(rec);
        toSync.push(rec);
        added++;
      }
    }
    await saveDB();
    render();
    if(state.settings.scriptUrl && toSync.length){
      showToast(`Importing… syncing ${toSync.length} records to Google Sheet 正在同步至谷歌表单…`);
      for(const rec of toSync){ await syncToGoogleSheet(rec); }
    }
    showToast(`${added} added, ${updated} updated${skipped?`, ${skipped} skipped (no name)`:''}`);
    render();
  };
  reader.readAsText(file);
}

  const deleteAllBtn = document.getElementById('deleteAllBtn');
  if(deleteAllBtn){
    deleteAllBtn.onclick = async ()=>{
      const lang = deleteAllBtn.dataset.lang;
      const toDelete = state.db.filter(r=>r.language===lang);
      const ok = await showConfirmModal(`Delete ALL ${toDelete.length} records in this tab? This cannot be undone.\n确定删除此分页全部 ${toDelete.length} 条记录吗？此操作无法撤销。`);
      if(ok){
        state.db = state.db.filter(r=>r.language!==lang);
        await saveDB();
        render();
        if(state.settings.scriptUrl && toDelete.length){
          showToast(`Removing ${toDelete.length} records from the Google Sheet… 正在从谷歌表单移除…`);
          for(const rec of toDelete){ await syncToGoogleSheet(rec, 'delete'); }
        }
        showToast('Records deleted. 记录已删除。');
        render();
      }
    };
  }
}

function attachProfileCardHandlers(){
  const printBtn = document.getElementById('printProfileBtn');
  if(printBtn) printBtn.onclick = ()=> window.print();
  const editFromProfile = document.getElementById('editFromProfileBtn');
  if(editFromProfile) editFromProfile.onclick = ()=>{
    state.editingId = editFromProfile.dataset.id; state.tab='add'; state.unlocked=true; render();
    window.scrollTo({top:0,behavior:'smooth'});
  };
}

function attachRowHandlers(){
  document.querySelectorAll('[data-editid]').forEach(tr=>{
    tr.onclick = ()=>{ state.editingId = tr.dataset.editid; state.tab='add'; window.scrollTo({top:0,behavior:'smooth'}); render(); };
  });
  document.querySelectorAll('[data-profileid]').forEach(el=>{
    el.onclick = ()=>{
      state.profileId = el.dataset.profileid;
      if(state.tab === 'search'){
        // already on the Search tab: just swap the profile card in place so the
        // search box and its results stay exactly as they were
        partialUpdate('profileCard-wrap', renderProfileCard(getRecord(state.profileId)));
        attachProfileCardHandlers();
        window.scrollTo({top:0,behavior:'smooth'});
      } else {
        state.tab = 'search';
        render();
      }
    };
  });
}

loadAll();
</script>
</body>
</html>
